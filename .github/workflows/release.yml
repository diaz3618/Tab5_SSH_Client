name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -e tab5
      - run: pio run -e tab5 -t buildfs
      - name: Package (file names carry the flash offsets, as in the M5Burner package)
        run: |
          mkdir release
          b=.pio/build/tab5
          cp $b/bootloader.bin release/bootloader_0x2000.bin
          cp $b/partitions.bin release/partitions_0x8000.bin
          cp $b/firmware.bin   release/firmware_0x10000.bin
          cp $b/littlefs.bin   release/littlefs_0x410000.bin
          cd release && sha256sum *.bin > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
